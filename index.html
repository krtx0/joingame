<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE - Join Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0e17 0%, #111827 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #818cf8;
            --primary-glow: rgba(129, 140, 248, 0.5);
            --accent: #00d2ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing blobs for premium design */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
        }
        body::before {
            background: var(--primary);
            top: 10%;
            left: 10%;
        }
        body::after {
            background: var(--accent);
            bottom: 10%;
            right: 10%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 3px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 32px;
            text-transform: uppercase;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .status-text {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .code-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 32px;
        }

        .code-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .code-val {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px var(--primary-glow);
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--primary-glow);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">VYBE</div>
        <div class="title">Join Game Room</div>
        
        <div class="code-container" id="code-box" style="display: none;">
            <div class="code-label">Room Code</div>
            <div class="code-val" id="room-code-display">----</div>
        </div>

        <p class="status-text">Redirecting you to your game room...</p>
        
        <a id="open-btn" class="btn" href="#">
            <span class="loader" id="btn-loader"></span>
            <span id="btn-text">OPEN GAME</span>
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const isFallback = urlParams.get('fallback') === 'true';

        if (roomId) {
            // Show room code
            document.getElementById('code-box').style.display = 'block';
            document.getElementById('room-code-display').innerText = roomId;

            // Generate App Launch URLs
            // Chrome Intent URL for Android (package com.krtx.vybe, scheme vybe)
            const intentUrl = "intent://tictactoe?roomId=" + roomId + "#Intent;scheme=vybe;package=com.krtx.vybe;S.browser_fallback_url=" + encodeURIComponent(window.location.origin + window.location.pathname + "?roomId=" + roomId + "&fallback=true") + ";end;";
            
            // Standard Custom Scheme for iOS/Other
            const customSchemeUrl = "vybe://tictactoe?roomId=" + roomId;
            
            const isAndroid = /Android/i.test(navigator.userAgent);
            const appUrl = isAndroid ? intentUrl : customSchemeUrl;
            
            document.getElementById('open-btn').href = appUrl;

            if (isFallback) {
                // If we returned from a failed intent redirect
                document.querySelector('.status-text').innerText = "We couldn't open the app automatically. Tap the button below to try again, or make sure the app is installed.";
                document.getElementById('btn-loader').style.display = 'none';
                document.getElementById('btn-text').innerText = "LAUNCH GAME";
            } else {
                // Auto redirect immediately
                setTimeout(() => {
                    window.location.href = appUrl;
                }, 500);

                // Update text after a delay if redirect didn't happen
                setTimeout(() => {
                    document.querySelector('.status-text').innerText = "If the game didn't open automatically, click the button below to join.";
                    document.getElementById('btn-loader').style.display = 'none';
                    document.getElementById('btn-text').innerText = "OPEN GAME";
                }, 3000);
            }
        } else {
            document.querySelector('.status-text').innerText = "Invalid link. No room ID was specified.";
            document.getElementById('open-btn').style.display = 'none';
        }
    </script>
</body>
</html>
