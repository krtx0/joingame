<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Hub - Join Room</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 15px;
            color: #78909C;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #B3E5FC;
            color: #000000;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 26px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>THE GAME HUB</h1>
        <p>Redirecting you to the Tic Tac Toe game room...</p>
        <a id="open-btn" class="btn" href="#">OPEN GAME</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        if (roomId) {
            const appUrl = "thegamehub://tictactoe?roomId=" + roomId;
            document.getElementById('open-btn').href = appUrl;
            
            // Auto-redirect immediately
            window.location.href = appUrl;
        } else {
            document.querySelector('p').innerText = "Invalid room code link. Please check the link and try again.";
            document.getElementById('open-btn').style.display = 'none';
        }
    </script>
</body>
</html>
